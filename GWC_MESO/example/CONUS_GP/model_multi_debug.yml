save_loc: '/glade/work/ksha/DWC_runs/CONUS_GP_multi/'
seed: 1000

data:
    boundary:
        variables: ['U', 'V', 'T', 'Q']
        save_loc: '/glade/derecho/scratch/ksha/DWC_data/CONUS_domain_GP/all_in_one/ERA5_GP_*.zarr'

        surface_variables: ['MSL', 'VAR_2T', 'VAR_10U', 'VAR_10V']
        save_loc_surface: '/glade/derecho/scratch/ksha/DWC_data/CONUS_domain_GP/all_in_one/ERA5_GP_*.zarr'

        all_varnames: ['U', 'V', 'T', 'Q', 'MSL', 'VAR_2T', 'VAR_10U', 'VAR_10V']
        levels: 11

        mean_path: '/glade/derecho/scratch/ksha/DWC_data/CONUS_domain_GP/mean_std/ERA5_6h_mean_1980_2019.nc'
        std_path: '/glade/derecho/scratch/ksha/DWC_data/CONUS_domain_GP/mean_std/ERA5_6h_std_residual_1980_2019.nc'

        history_len: 2
        valid_history_len: 2

        forecast_len: 0
        valid_forecast_len: 0

    levels: 16
    variables: ['WRF_P', 'WRF_U', 'WRF_V', 'WRF_T', 'WRF_Q']
    save_loc: '/glade/derecho/scratch/ksha/DWC_data/CONUS_domain_GP/all_in_one/C404_GP_*.zarr'
    #'/glade/campaign/ral/hap/ksha/DWC_data/CONUS_domain_GP/all_in_one/C404_GP_*.zarr'

    surface_variables: ['WRF_SP', 'WRF_T2', 'WRF_TD2', 'WRF_U10', 'WRF_V10']
    save_loc_surface: '/glade/derecho/scratch/ksha/DWC_data/CONUS_domain_GP/all_in_one/C404_GP_*.zarr'

    #dynamic_forcing_variables: []
    #save_loc_dynamic_forcing: '/glade/derecho/scratch/ksha/DWC_data/CONUS_domain_GP/all_in_one/C404_GP_*.zarr'

    diagnostic_variables: ['WRF_precip', 'WRF_PWAT', 'WRF_radar_composite', 'WRF_TCC', 'WRF_MLCAPE', 'WRF_OLR']
    save_loc_diagnostic: '/glade/derecho/scratch/ksha/DWC_data/CONUS_domain_GP/all_in_one/C404_GP_*.zarr'

    static_variables: ['z_norm', 'var_norm', 'lu_norm', 'LANDMASK']
    save_loc_static: '/glade/derecho/scratch/ksha/DWC_data/CONUS_domain_GP/static/C404_GP_static.zarr'

    #save_loc_physics: '/glade/campaign/ral/hap/ksha/DWC_data/CONUS_domain_GP/all_in_one/C404_GP_*.zarr'

    history_len: 1
    valid_history_len: 1

    forecast_len: 5
    valid_forecast_len: 72
    backprop_on_timestep: [2, 5]

    # mean / std path
    mean_path: '/glade/derecho/scratch/ksha/DWC_data/CONUS_domain_GP/mean_std/C404_6h_mean_1980_2019_16lev.nc'
    std_path: '/glade/derecho/scratch/ksha/DWC_data/CONUS_domain_GP/mean_std/C404_6h_std_residual_1980_2019_16lev.nc'

    # train / validation split
    train_years: [1980, 1981]
    valid_years: [1980, 1981]
    #test_years: [2020, 2022]

    # data workflow
    scaler_type: 'std-wrf'

    one_shot: False
    lead_time_periods: 1
    skip_periods: null
    static_first: True


trainer:
    type: multi-step-wrf
    
    mode: fsdp
    cpu_offload: False
    activation_checkpoint: True
    
    load_weights: True
    load_optimizer: False
    load_scaler: False
    load_sheduler: False
    num_epoch: 1
    
    skip_validation: False
    update_learning_rate: False
    
    save_backup_weights: True
    save_best_weights: True
    save_metric_vars: True
    
    learning_rate: 3.0e-07
    weight_decay: 1.0e-06
    
    train_batch_size: 1
    valid_batch_size: 1
    
    batches_per_epoch: 10
    valid_batches_per_epoch: 3
    stopping_patience: 999
    
    start_epoch: 0

    reload_epoch: True
    epochs: &epochs 999
    
    use_scheduler: False
    #scheduler: {'scheduler_type': 'cosine-annealing', 'T_max': *epochs,  'last_epoch': -1}
    
    amp: False
    grad_accum_every: 1 
    grad_max_norm: 32.0
    thread_workers: 4
    valid_thread_workers: 0


model:
    type: "wrf"
    levels: 16

    param_interior:
        frames: 1                # number of input states
        image_height: 336        # number of latitude grids
        image_width: 336         # number of longitude grids
        levels: 16               # number of upper-air variable levels
        channels: 5              # upper-air variable channels
        surface_channels: 5      # surface variable channels
        input_only_channels: 4   # dynamic forcing, forcing, static channels
        output_only_channels: 6  # diagnostic variable channels
        patch_height: 4          # number of latitude grids in each 3D patch
        patch_width: 4           # number of longitude grids in each 3D patch
        frame_patch_size: 1      # number of input states in each 3D patch
        dim: 1024

    param_outside:
        frames: 2                # number of input states
        image_height: 88         # number of latitude grids
        image_width: 112         # number of longitude grids
        levels: 11               # number of upper-air variable levels
        channels: 4              # upper-air variable channels
        surface_channels: 4      # surface variable channels
        patch_height: 4
        patch_width: 4
        frame_patch_size: 2
        dim: 512

    # hidden layers
    time_encode_dim: 16
    num_groups: 32          # number of groups (default: 32)
    num_heads: 8            # number of heads (default: 8)
    window_size: 7          # window size (default: 7)
    depth: 48               # number of swin transformers

    use_spectral_norm: True
    interp: False

    padding_conf:
        activate: False

    post_conf:
        activate: True

        tracer_fixer:
            activate: True
            denorm: True
            tracer_name: ['WRF_Q', 'WRF_precip', 'WRF_PWAT', 'WRF_radar_composite', 'WRF_TCC', 'WRF_MLCAPE']
            tracer_thres: [0, 0, 0, 0, 0, 0]

    
loss: 
    # the main training loss
    training_loss: "mse"
   
    # use precip loss
    # precip_loss:
    #    activate: True
    #    precipitation_name: ['WRF_precip']
    #    precipitation_mean: 0.11036608
    #    precipitation_std: 10.19692748

    use_power_loss: False 
    use_spectral_loss: False

    use_latitude_weights: False
    latitude_weights: '/glade/derecho/scratch/ksha/DWC_data/CONUS_domain_GP/static/C404_GP_static.zarr'

    use_variable_weights: True
    variable_weights:
        WRF_P: [0.10080645, 0.09677419, 0.09475806, 0.09274194, 0.08870967, 0.08568548, 0.08064516, 0.07560484, 0.06854839, 0.06149194, 0.05040323, 0.04233871, 0.02822581, 0.01814516, 0.01008064, 0.00504032]
        WRF_U: [0.10080645, 0.09677419, 0.09475806, 0.09274194, 0.08870967, 0.08568548, 0.08064516, 0.07560484, 0.06854839, 0.06149194, 0.05040323, 0.04233871, 0.02822581, 0.01814516, 0.01008064, 0.00504032]
        WRF_V: [0.10080645, 0.09677419, 0.09475806, 0.09274194, 0.08870967, 0.08568548, 0.08064516, 0.07560484, 0.06854839, 0.06149194, 0.05040323, 0.04233871, 0.02822581, 0.01814516, 0.01008064, 0.00504032]
        WRF_T: [0.10080645, 0.09677419, 0.09475806, 0.09274194, 0.08870967, 0.08568548, 0.08064516, 0.07560484, 0.06854839, 0.06149194, 0.05040323, 0.04233871, 0.02822581, 0.01814516, 0.01008064, 0.00504032]
        WRF_Q: [0.10080645, 0.09677419, 0.09475806, 0.09274194, 0.08870967, 0.08568548, 0.08064516, 0.07560484, 0.06854839, 0.06149194, 0.05040323, 0.04233871, 0.02822581, 0.01814516, 0.01008064, 0.00504032]
        WRF_SP: 0.12
